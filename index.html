<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Battle Cats - MLBB Web MOBA</title>
    <style>
        :root {
            --bg-dark: #070a12;
            --panel-bg: rgba(15, 23, 42, 0.9);
            --accent-blue: #00d2ff;
            --accent-red: #ff4757;
            --accent-gold: #ffa500;
            --accent-purple: #a855f7;
            --text-light: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        header {
            width: 100%;
            max-width: 900px;
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px 20px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        .brand h1 {
            font-size: 18px;
            background: linear-gradient(45deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stats-bar {
            display: flex;
            gap: 15px;
            font-size: 13px;
            font-weight: 600;
        }

        .stat-item {
            background: rgba(0,0,0,0.4);
            padding: 4px 12px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .game-container {
            position: relative;
            width: 890px;
            height: 580px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.2), 0 0 80px rgba(0, 0, 0, 0.9);
            border: 2px solid rgba(0, 210, 255, 0.4);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #142817;
            cursor: crosshair;
        }

        .minimap-box {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 150px;
            height: 150px;
            background: rgba(0, 0, 0, 0.75);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }

        .buff-bar {
            position: absolute;
            top: 12px;
            left: 12px;
            display: flex;
            gap: 8px;
        }

        .buff-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            border: 2px solid #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
            display: none;
        }
        .buff-red { background: #ff4757; border-color: #ffa500; }
        .buff-blue { background: #00d2ff; border-color: #38ef7d; }
        .buff-turtle { background: #eccc68; color: #000; border-color: #fff; }

        .hud-overlay {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: var(--panel-bg);
            padding: 8px 16px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
        }

        .skill-box {
            width: 48px;
            height: 48px;
            background: #1a2235;
            border: 2px solid var(--accent-blue);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            font-weight: bold;
            font-size: 11px;
        }

        .skill-key {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 11px;
            color: var(--accent-gold);
        }

        .cooldown-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.8);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 13px;
            display: none;
        }

        .announcement {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 22px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 10px #000, 0 0 20px #ff4500;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .modal {
            position: absolute;
            inset: 0;
            background: rgba(10, 15, 25, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .modal h2 { font-size: 40px; margin-bottom: 10px; }
        .modal.victory h2 { color: var(--accent-blue); text-shadow: 0 0 20px var(--accent-blue); }
        .modal.defeat h2 { color: var(--accent-red); text-shadow: 0 0 20px var(--accent-red); }

        .btn {
            background: linear-gradient(135deg, var(--accent-blue), #0072ff);
            color: #fff; border: none; padding: 10px 26px; font-size: 15px;
            font-weight: bold; border-radius: 20px; cursor: pointer; margin-top: 15px;
        }

        .controls-panel {
            margin-top: 8px; display: flex; gap: 15px; font-size: 12px; color: #a0aec0;
        }
        .key-badge { background: #2d3748; color: #fff; padding: 1px 5px; border-radius: 3px; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1>The Battle Cats MLBB</h1>
        </div>
        <div class="stats-bar">
            <div class="stat-item" style="color: #60a5fa;">⏱️ <span id="timeVal">00:00</span></div>
            <div class="stat-item" style="color: var(--accent-gold);">💰 <span id="goldVal">300</span> G</div>
            <div class="stat-item" style="color: #2ed573;">⭐ Lv.<span id="levelVal">1</span></div>
            <div class="stat-item" style="color: var(--accent-red);">⚔️ Mạng: <span id="killVal">0</span></div>
        </div>
    </header>

    <div class="game-container">
        <canvas id="mobaCanvas" width="890" height="580"></canvas>

        <div class="minimap-box">
            <canvas id="minimapCanvas" width="150" height="150"></canvas>
        </div>

        <div class="buff-bar">
            <div class="buff-icon buff-red" id="buffRedIcon">RED<br><span id="redTimer">60</span>s</div>
            <div class="buff-icon buff-blue" id="buffBlueIcon">BLUE<br><span id="blueTimer">60</span>s</div>
            <div class="buff-icon buff-turtle" id="buffTurtleIcon">GIÁP<br>RÙA</div>
        </div>

        <div class="announcement" id="announceBox">TIÊU DIỆT LORD!</div>

        <div class="hud-overlay">
            <div class="skill-box">
                <span class="skill-key">1</span><span>Chưởng</span>
                <div class="cooldown-overlay" id="cd-1">0</div>
            </div>
            <div class="skill-box">
                <span class="skill-key">2</span><span>Lướt</span>
                <div class="cooldown-overlay" id="cd-2">0</div>
            </div>
            <div class="skill-box">
                <span class="skill-key">3</span><span>Hồi Máu</span>
                <div class="cooldown-overlay" id="cd-3">0</div>
            </div>
            <div class="skill-box" style="border-color: var(--accent-gold);">
                <span class="skill-key">4</span><span>Bão Điện</span>
                <div class="cooldown-overlay" id="cd-4">0</div>
            </div>
        </div>

        <div id="endModal" class="modal" style="display: none;">
            <h2 id="modalTitle">VICTORY!</h2>
            <p id="modalDesc">Bạn đã đập tan Căn Cứ Địch!</p>
            <button class="btn" onclick="restartGame()">Chơi Lại</button>
        </div>
    </div>

    <div class="controls-panel">
        <div>Di chuyển: <span class="key-badge">WASD</span> | Đánh thường: <span class="key-badge">Space</span></div>
        <div>Chiêu thức: <span class="key-badge">1</span> Đạn định hướng | <span class="key-badge">2</span> Tốc biến | <span class="key-badge">3</span> Giáp/Máu | <span class="key-badge">4</span> Chiêu cuối</div>
    </div>

    <script>
        const canvas = document.getElementById('mobaCanvas');
        const ctx = canvas.getContext('2d');
        const miniCanvas = document.getElementById('minimapCanvas');
        const miniCtx = miniCanvas.getContext('2d');

        const MAP_W = 2000, MAP_H = 2000;
        let camX = 0, camY = 0;

        let isGameOver = false;
        let killCount = 0;
        let gameTime = 0;
        let mouseX = 0, mouseY = 0;

        const player = {
            x: 250, y: 1750, radius: 16, color: '#00d2ff', speed: 4.2,
            hp: 450, maxHp: 450, shield: 0,
            gold: 300, level: 1, exp: 0, nextExp: 100,
            atkRange: 140, atkDmg: 40, atkCooldown: 0,
            redBuffTimer: 0, blueBuffTimer: 0,
            skills: {
                '1': { cd: 0, maxCd: 3 },
                '2': { cd: 0, maxCd: 5 },
                '3': { cd: 0, maxCd: 8 },
                '4': { cd: 0, maxCd: 12 }
            }
        };

        // Danh sách trụ MLBB với Giáp Vàng (Gold Shield 5 phút đầu) & Tầm đánh chuẩn
        let redTurrets = [
            { id: 1, x: 250, y: 700, hp: 650, maxHp: 650, r: 24, range: 210, tier: 1, goldShield: 350, maxGoldShield: 350, target: null, attackCd: 0, heat: 1 },
            { id: 2, x: 250, y: 350, hp: 800, maxHp: 800, r: 24, range: 210, tier: 2, goldShield: 0, maxGoldShield: 0, target: null, attackCd: 0, heat: 1 },
            { id: 3, x: 1000, y: 1000, hp: 650, maxHp: 650, r: 24, range: 210, tier: 1, goldShield: 350, maxGoldShield: 350, target: null, attackCd: 0, heat: 1 },
            { id: 4, x: 1300, y: 700, hp: 800, maxHp: 800, r: 24, range: 210, tier: 2, goldShield: 0, maxGoldShield: 0, target: null, attackCd: 0, heat: 1 },
            { id: 5, x: 1300, y: 1750, hp: 650, maxHp: 650, r: 24, range: 210, tier: 1, goldShield: 350, maxGoldShield: 350, target: null, attackCd: 0, heat: 1 },
            { id: 6, x: 1650, y: 1750, hp: 800, maxHp: 800, r: 24, range: 210, tier: 2, goldShield: 0, maxGoldShield: 0, target: null, attackCd: 0, heat: 1 },
            { id: 7, x: 1750, y: 250, hp: 1400, maxHp: 1400, r: 34, range: 240, tier: 3, isNexus: true, goldShield: 0, maxGoldShield: 0, target: null, attackCd: 0, heat: 1 }
        ];

        let jungleMonsters = [
            { id: 'b_blue', homeX: 450, homeY: 1350, x: 450, y: 1350, r: 20, hp: 600, maxHp: 600, type: 'blueBuff', color: '#00d2ff', leashR: 200, state: 'idle', target: null },
            { id: 'b_red',  homeX: 750, homeY: 1650, x: 750, y: 1650, r: 20, hp: 600, maxHp: 600, type: 'redBuff', color: '#ff4757', leashR: 200, state: 'idle', target: null },
            { id: 'r_blue', homeX: 1550, homeY: 650, x: 1550, y: 650, r: 20, hp: 600, maxHp: 600, type: 'blueBuff', color: '#00d2ff', leashR: 200, state: 'idle', target: null },
            { id: 'r_red',  homeX: 1250, homeY: 350, x: 1250, y: 350, r: 20, hp: 600, maxHp: 600, type: 'redBuff', color: '#ff4757', leashR: 200, state: 'idle', target: null },
            { id: 'boss', homeX: 650, homeY: 650, x: 650, y: 650, r: 28, hp: 1200, maxHp: 1200, type: 'turtle', color: '#eccc68', leashR: 220, state: 'idle', target: null }
        ];

        let blueMinions = [];
        let redMinions = [];
        let alliedLord = null;
        let projectiles = [];
        let particles = [];
        let floatTexts = [];

        const keys = {};
        window.addEventListener('keydown', e => { 
            keys[e.code] = true; 
            handleSkill(e.code, e.key); 
        });
        window.addEventListener('keyup', e => keys[e.code] = false);
        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });

        function handleSkill(code, key) {
            if (isGameOver) return;
            let worldMouseX = mouseX + camX;
            let worldMouseY = mouseY + camY;
            let cdr = player.blueBuffTimer > 0 ? 0.7 : 1.0;

            if ((key === '1' || code === 'Digit1' || code === 'Numpad1') && player.skills['1'].cd <= 0) {
                let angle = Math.atan2(worldMouseY - player.y, worldMouseX - player.x);
                projectiles.push({
                    x: player.x, y: player.y,
                    vx: Math.cos(angle) * 10, vy: Math.sin(angle) * 10,
                    r: 9, color: '#00ffff', dmg: 90 + (player.level * 12), range: 450, dist: 0, isPlayer: true
                });
                player.skills['1'].cd = player.skills['1'].maxCd * cdr;
                addParticles(player.x, player.y, '#00ffff', 8);
            }
            else if ((key === '2' || code === 'Digit2' || code === 'Numpad2') && player.skills['2'].cd <= 0) {
                let angle = Math.atan2(worldMouseY - player.y, worldMouseX - player.x);
                player.x += Math.cos(angle) * 140;
                player.y += Math.sin(angle) * 140;
                player.x = Math.max(30, Math.min(MAP_W - 30, player.x));
                player.y = Math.max(30, Math.min(MAP_H - 30, player.y));
                player.skills['2'].cd = player.skills['2'].maxCd * cdr;
                addParticles(player.x, player.y, '#38ef7d', 14);
            }
            else if ((key === '3' || code === 'Digit3' || code === 'Numpad3') && player.skills['3'].cd <= 0) {
                player.hp = Math.min(player.maxHp, player.hp + 130);
                player.shield += 90;
                addFloatText(player.x, player.y - 15, '+130 HP', '#2ed573');
                player.skills['3'].cd = player.skills['3'].maxCd * cdr;
                addParticles(player.x, player.y, '#2ed573', 15);
            }
            else if ((key === '4' || code === 'Digit4' || code === 'Numpad4') && player.skills['4'].cd <= 0) {
                addParticles(player.x, player.y, '#ffa500', 40);
                let targets = [...redMinions, ...redTurrets, ...jungleMonsters];
                targets.forEach(t => {
                    if (t.hp > 0 && Math.hypot(t.x - player.x, t.y - player.y) < 230) {
                        damageTarget(t, 200 + (player.level * 22), true);
                        if (t.type) triggerAgro(t, player);
                    }
                });
                player.skills['4'].cd = player.skills['4'].maxCd * cdr;
            }
        }

        function triggerAgro(m, attacker) {
            if (m.state !== 'dead') {
                m.target = attacker;
                m.state = 'chasing';
            }
        }

        // Cơ chế gây sát thương MLBB (Khiên giáp trụ, thưởng giáp vàng, sát thương lính)
        function damageTarget(target, dmg, isFromPlayer = false) {
            let actualDmg = dmg;
            if (isFromPlayer && player.redBuffTimer > 0) {
                actualDmg += 20;
                addFloatText(target.x, target.y - 10, '+20 Bùa Đỏ', '#ff4757');
            }

            // Cơ chế MLBB: Trụ có giáp chống đẩy lén (Backdoor Protection)
            if (target.range && !target.isNexus) {
                let hasMinionInRange = blueMinions.some(m => Math.hypot(m.x - target.x, m.y - target.y) <= target.range);
                if (!hasMinionInRange && (!alliedLord || Math.hypot(alliedLord.x - target.x, alliedLord.y - target.y) > target.range)) {
                    actualDmg *= 0.35; // Giảm 65% sát thương khi không có lính đẩy cùng
                    addFloatText(target.x, target.y - 15, 'KHIÊN CHỐNG ĐẨY LÉN!', '#aaa');
                }

                // Cơ chế MLBB: Giáp vàng 5 phút đầu (Gold Shield)
                if (gameTime < 300 && target.goldShield > 0) {
                    actualDmg *= 0.5; // Giảm 50% sát thương vào giáp vàng
                    target.goldShield -= actualDmg;
                    if (isFromPlayer) {
                        let goldEarned = Math.floor(actualDmg * 0.7);
                        player.gold += goldEarned;
                        addFloatText(player.x, player.y - 20, `+${goldEarned}G GIÁP VÀNG`, '#ffd700');
                    }
                    if (target.goldShield < 0) target.goldShield = 0;
                }

                // Trụ bị người chơi tấn công -> Kích hoạt Trụ tự vệ phản công người chơi nếu đứng gần
                if (isFromPlayer) {
                    redTurrets.forEach(tur => {
                        if (tur.hp > 0 && Math.hypot(player.x - tur.x, player.y - tur.y) <= tur.range) {
                            tur.target = player; // Chuyển nộ Trụ sang người chơi lập tức!
                        }
                    });
                }
            }

            target.hp -= actualDmg;
            addFloatText(target.x, target.y, `-${Math.round(actualDmg)}`, isFromPlayer ? '#ffffff' : '#f5cd79');

            // Thưởng Last-Hit Lính MLBB
            if (target.hp <= 0 && isFromPlayer) {
                if (target.isMinion) {
                    let bonusGold = Math.floor(target.goldValue * 0.5);
                    player.gold += target.goldValue + bonusGold;
                    player.exp += target.expValue;
                    addFloatText(target.x, target.y - 10, `+${target.goldValue + bonusGold}G (LAST HIT!)`, '#ffd700');
                    checkLevelUp();
                }
            }
        }

        // Tạo đợt lính MLBB chuẩn (Cận chiến, Xạ thủ, Xe pháo / Lính siêu cấp)
        function spawnWave() {
            const paths = [
                { target: {x: 250, y: 250}, final: {x: 1750, y: 250} },
                { target: {x: 1000, y: 1000}, final: {x: 1750, y: 250} },
                { target: {x: 1750, y: 1750}, final: {x: 1750, y: 250} }
            ];

            paths.forEach((p, idx) => {
                let hasSuperMinion = redTurrets.filter(t => t.hp <= 0).length >= 2;

                // Cấu trúc đợt lính MLBB: 1 Lính Khiên (Melee), 1 Lính Phép/Xạ thủ (Ranged), 1 Xe Pháo (Siege)
                const waveConfig = [
                    { type: 'melee', hp: 280, atk: 18, range: 35, speed: 1.8, r: 10, color: '#38ef7d', gold: 35, exp: 25 },
                    { type: 'ranged', hp: 160, atk: 28, range: 130, speed: 1.8, r: 8, color: '#00d2ff', gold: 30, exp: 20 },
                    hasSuperMinion ? 
                    { type: 'super', hp: 800, atk: 65, range: 45, speed: 1.5, r: 15, color: '#a855f7', gold: 75, exp: 60 } :
                    { type: 'siege', hp: 450, atk: 45, range: 150, speed: 1.6, r: 13, color: '#f5cd79', gold: 60, exp: 45 }
                ];

                waveConfig.forEach((cfg, offset) => {
                    setTimeout(() => {
                        // Lính Xanh
                        blueMinions.push({
                            x: 250 + (offset * 12), y: 1750 - (offset * 12),
                            hp: cfg.hp, maxHp: cfg.hp, r: cfg.r, color: cfg.color, speed: cfg.speed,
                            atk: cfg.atk, range: cfg.range, type: cfg.type, isBlue: true, isMinion: true,
                            goldValue: cfg.gold, expValue: cfg.exp, target: p.target, finalTarget: p.final, attackCd: 0
                        });
                        // Lính Đỏ
                        redMinions.push({
                            x: 1750 - (offset * 12), y: 250 + (offset * 12),
                            hp: cfg.hp, maxHp: cfg.hp, r: cfg.r, color: '#ff4757', speed: cfg.speed,
                            atk: cfg.atk, range: cfg.range, type: cfg.type, isBlue: false, isMinion: true,
                            goldValue: cfg.gold, expValue: cfg.exp, target: p.target, finalTarget: {x: 250, y: 1750}, attackCd: 0
                        });
                    }, offset * 400);
                });
            });
        }

        function triggerAnnouncement(text) {
            const box = document.getElementById('announceBox');
            box.innerText = text;
            box.style.opacity = '1';
            setTimeout(() => { box.style.opacity = '0'; }, 3000);
        }

        function killJungleMonster(m) {
            m.hp = 0;
            m.state = 'dead';
            m.respawnTimer = 60;

            player.gold += 65;
            player.exp += 50;
            checkLevelUp();

            if (m.type === 'redBuff') {
                player.redBuffTimer = 60;
                triggerAnnouncement('BẠN ĐÃ NHẬN BÙA ĐỎ!');
            } else if (m.type === 'blueBuff') {
                player.blueBuffTimer = 60;
                triggerAnnouncement('BẠN ĐÃ NHẬN BÙA XANH!');
            } else if (m.type === 'turtle') {
                player.shield += 250;
                player.gold += 150;
                triggerAnnouncement('TOÀN ĐỘI TIÊU DIỆT RÙA!');
            } else if (m.type === 'lord') {
                triggerAnnouncement('ĐỘI BẠN ĐÃ TIÊU DIỆT LORD!');
                alliedLord = {
                    x: 250, y: 1750, hp: 2400, maxHp: 2400, r: 26, color: '#a855f7', speed: 1.4,
                    target: {x: 1000, y: 1000}, finalTarget: {x: 1750, y: 250}
                };
            }
            updateUI();
        }

        function checkLevelUp() {
            if (player.exp >= player.nextExp) {
                player.level++;
                player.exp -= player.nextExp;
                player.nextExp = Math.floor(player.nextExp * 1.4);
                player.maxHp += 70;
                player.hp = player.maxHp;
                player.atkDmg += 12;
                addFloatText(player.x, player.y - 25, 'LEVEL UP!', '#00d2ff');
            }
        }

        function addParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                let ang = Math.random() * Math.PI * 2;
                let spd = Math.random() * 4 + 1;
                particles.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, life: 18, color, r: 3 });
            }
        }

        function addFloatText(x, y, text, color) {
            floatTexts.push({ x, y, text, color, life: 28 });
        }

        function updateUI() {
            document.getElementById('goldVal').innerText = player.gold;
            document.getElementById('levelVal').innerText = player.level;
            document.getElementById('killVal').innerText = killCount;

            let mins = Math.floor(gameTime / 60).toString().padStart(2, '0');
            let secs = Math.floor(gameTime % 60).toString().padStart(2, '0');
            document.getElementById('timeVal').innerText = `${mins}:${secs}`;

            document.getElementById('buffRedIcon').style.display = player.redBuffTimer > 0 ? 'flex' : 'none';
            document.getElementById('redTimer').innerText = Math.ceil(player.redBuffTimer);

            document.getElementById('buffBlueIcon').style.display = player.blueBuffTimer > 0 ? 'flex' : 'none';
            document.getElementById('blueTimer').innerText = Math.ceil(player.blueBuffTimer);

            document.getElementById('buffTurtleIcon').style.display = player.shield > 0 ? 'flex' : 'none';
        }

        let frameCount = 0;
        function update() {
            if (isGameOver) return;
            frameCount++;
            if (frameCount % 60 === 0) {
                gameTime++;
                if (player.redBuffTimer > 0) player.redBuffTimer--;
                if (player.blueBuffTimer > 0) player.blueBuffTimer--;
                
                if (gameTime === 300) {
                    let boss = jungleMonsters.find(m => m.id === 'boss');
                    if (boss) {
                        boss.type = 'lord';
                        boss.color = '#a855f7';
                        boss.hp = boss.maxHp = 2600;
                        triggerAnnouncement('LORD ĐÃ XUẤT HIỆN!');
                    }
                }
                updateUI();
            }

            // Di chuyển
            if (keys['KeyW'] || keys['ArrowUp']) player.y -= player.speed;
            if (keys['KeyS'] || keys['ArrowDown']) player.y += player.speed;
            if (keys['KeyA'] || keys['ArrowLeft']) player.x -= player.speed;
            if (keys['KeyD'] || keys['ArrowRight']) player.x += player.speed;

            player.x = Math.max(20, Math.min(MAP_W - 20, player.x));
            player.y = Math.max(20, Math.min(MAP_H - 20, player.y));

            camX = Math.max(0, Math.min(MAP_W - canvas.width, player.x - canvas.width / 2));
            camY = Math.max(0, Math.min(MAP_H - canvas.height, player.y - canvas.height / 2));

            // Đánh thường (Space)
            if (player.atkCooldown > 0) player.atkCooldown -= 1/60;
            if (keys['Space'] && player.atkCooldown <= 0) {
                let targets = [...redMinions, ...redTurrets, ...jungleMonsters].filter(t => t.hp > 0 && Math.hypot(t.x - player.x, t.y - player.y) <= player.atkRange);
                if (targets.length > 0) {
                    let closest = targets.reduce((p, c) => Math.hypot(c.x - player.x, c.y - player.y) < Math.hypot(p.x - player.x, p.y - player.y) ? c : p);
                    damageTarget(closest, player.atkDmg, true);
                    player.atkCooldown = 0.4;
                    if (closest.type) triggerAgro(closest, player);
                }
            }

            // Hồi chiêu 1-4
            ['1', '2', '3', '4'].forEach(k => {
                if (player.skills[k].cd > 0) {
                    player.skills[k].cd -= 1/60;
                    let el = document.getElementById(`cd-${k}`);
                    if (el) {
                        el.style.display = 'flex';
                        el.innerText = Math.ceil(player.skills[k].cd);
                    }
                } else {
                    let el = document.getElementById(`cd-${k}`);
                    if (el) el.style.display = 'none';
                }
            });

            // Ra lính mỗi 30 giây (1800 frames)
            if (frameCount % 1800 === 0 || frameCount === 1) spawnWave();

            // Xử lý Quái rừng
            jungleMonsters.forEach(m => {
                if (m.state === 'dead') {
                    m.respawnTimer -= 1/60;
                    if (m.respawnTimer <= 0) {
                        m.hp = m.maxHp;
                        m.x = m.homeX; m.y = m.homeY;
                        m.state = 'idle';
                    }
                    return;
                }

                if (m.state === 'chasing' && m.target) {
                    let distToHome = Math.hypot(m.x - m.homeX, m.y - m.homeY);
                    if (distToHome > m.leashR) {
                        m.state = 'returning';
                        m.target = null;
                    } else {
                        let distToTarget = Math.hypot(m.target.x - m.x, m.target.y - m.y);
                        if (distToTarget < 40) {
                            if (player.shield > 0) player.shield -= 0.8;
                            else player.hp -= 0.8;
                            if (player.hp <= 0) endGame(false);
                        } else {
                            let angle = Math.atan2(m.target.y - m.y, m.target.x - m.x);
                            m.x += Math.cos(angle) * 2;
                            m.y += Math.sin(angle) * 2;
                        }
                    }
                } else if (m.state === 'returning') {
                    let angle = Math.atan2(m.homeY - m.y, m.homeX - m.x);
                    m.x += Math.cos(angle) * 5;
                    m.y += Math.sin(angle) * 5;
                    m.hp = Math.min(m.maxHp, m.hp + m.maxHp * 0.05);

                    if (Math.hypot(m.x - m.homeX, m.y - m.homeY) < 5) {
                        m.x = m.homeX; m.y = m.homeY;
                        m.hp = m.maxHp;
                        m.state = 'idle';
                    }
                }
            });

            // Xử lý Lính 2 bên (AI Lính MLBB)
            [blueMinions, redMinions].forEach((team, isRed) => {
                team.forEach(m => {
                    if (m.hp <= 0) return;
                    if (m.attackCd > 0) m.attackCd -= 1/60;

                    let enemies = isRed ? [...blueMinions, player] : [...redMinions, ...redTurrets];
                    if (alliedLord && isRed) enemies.push(alliedLord);

                    // Tìm kẻ địch trong tầm đánh
                    let targetsInRange = enemies.filter(e => e.hp > 0 && Math.hypot(e.x - m.x, e.y - m.y) <= m.range);

                    if (targetsInRange.length > 0) {
                        let target = targetsInRange[0];
                        if (m.attackCd <= 0) {
                            if (m.type === 'ranged' || m.type === 'siege') {
                                // Lính bắn xa bắn đạn
                                projectiles.push({
                                    x: m.x, y: m.y,
                                    vx: Math.cos(Math.atan2(target.y - m.y, target.x - m.x)) * 6,
                                    vy: Math.sin(Math.atan2(target.y - m.y, target.x - m.x)) * 6,
                                    r: 4, color: isRed ? '#ff4757' : '#00ffff', dmg: m.atk, range: m.range + 40, dist: 0, targetUnit: target
                                });
                            } else {
                                // Lính cận chiến chém trực tiếp
                                damageTarget(target, m.atk, false);
                                if (target === player && player.hp <= 0) endGame(false);
                            }
                            m.attackCd = 1.0;
                        }
                    } else {
                        // Di chuyển theo tuyến đường
                        let dist = Math.hypot(m.target.x - m.x, m.target.y - m.y);
                        let curr = dist < 30 ? m.finalTarget : m.target;
                        let angle = Math.atan2(curr.y - m.y, curr.x - m.x);
                        m.x += Math.cos(angle) * m.speed;
                        m.y += Math.sin(angle) * m.speed;
                    }
                });
            });

            // Xử lý Lord đồng minh
            if (alliedLord && alliedLord.hp > 0) {
                let targets = [...redMinions, ...redTurrets].filter(e => e.hp > 0 && Math.hypot(e.x - alliedLord.x, e.y - alliedLord.y) <= 130);
                if (targets.length > 0) {
                    damageTarget(targets[0], 3.0, false);
                } else {
                    let dist = Math.hypot(alliedLord.target.x - alliedLord.x, alliedLord.target.y - alliedLord.y);
                    let curr = dist < 40 ? alliedLord.finalTarget : alliedLord.target;
                    let angle = Math.atan2(curr.y - alliedLord.y, curr.x - alliedLord.x);
                    alliedLord.x += Math.cos(angle) * alliedLord.speed;
                    alliedLord.y += Math.sin(angle) * alliedLord.speed;
                }
            }

            // Xử lý Bắn & Ưu tiên mục tiêu của Trụ Đỏ (Cơ chế MLBB)
            redTurrets.forEach(tur => {
                if (tur.hp <= 0) return;
                if (tur.attackCd > 0) tur.attackCd -= 1/60;

                // Tìm mục tiêu trong tầm đánh trụ: Lính Xanh > Lord > Người chơi
                let validTargets = [...blueMinions, player].filter(u => u.hp > 0 && Math.hypot(u.x - tur.x, u.y - tur.y) <= tur.range);
                if (alliedLord && Math.hypot(alliedLord.x - tur.x, alliedLord.y - tur.y) <= tur.range) validTargets.unshift(alliedLord);

                if (validTargets.length > 0) {
                    // Nếu chưa có mục tiêu hoặc mục tiêu cũ ra khỏi tầm -> Chọn mục tiêu mới (Ưu tiên Lính trước Player)
                    if (!tur.target || tur.target.hp <= 0 || Math.hypot(tur.target.x - tur.x, tur.target.y - tur.y) > tur.range) {
                        tur.target = validTargets[0];
                        tur.heat = 1; // Reset nộ sát thương tăng dần
                    }

                    if (tur.attackCd <= 0 && tur.target) {
                        let target = tur.target;
                        let turretDmg = 90 * tur.heat;

                        projectiles.push({
                            x: tur.x, y: tur.y,
                            vx: Math.cos(Math.atan2(target.y - tur.y, target.x - tur.x)) * 8,
                            vy: Math.sin(Math.atan2(target.y - tur.y, target.x - tur.x)) * 8,
                            r: 7, color: '#ff2ed0', dmg: turretDmg, range: tur.range + 50, dist: 0, targetUnit: target, isTurretShot: true
                        });

                        // Nếu bắn vào người chơi, tăng nhiệt sát thương phát sau (Sát thương tăng dần MLBB)
                        if (target === player) {
                            tur.heat = Math.min(2.5, tur.heat + 0.25);
                        }

                        tur.attackCd = 1.2; // Tốc độ bắn của Trụ MLBB
                    }
                } else {
                    tur.target = null;
                    tur.heat = 1;
                }
            });

            let nexus = redTurrets.find(s => s.isNexus);
            if (nexus && nexus.hp <= 0) endGame(true);

            // Xử lý đạn bay
            projectiles.forEach(p => {
                p.x += p.vx; p.y += p.vy; p.dist += Math.hypot(p.vx, p.vy);
                
                if (p.isPlayer) {
                    [...redMinions, ...redTurrets, ...jungleMonsters].forEach(t => {
                        if (t.hp > 0 && Math.hypot(t.x - p.x, t.y - p.y) < (t.r || 15) + p.r) {
                            damageTarget(t, p.dmg, true);
                            if (t.type) triggerAgro(t, player);
                            p.dist = 9999;
                            if (t.hp <= 0 && t.type) killJungleMonster(t);
                        }
                    });
                } else if (p.targetUnit) {
                    if (Math.hypot(p.targetUnit.x - p.x, p.targetUnit.y - p.y) < (p.targetUnit.r || 12) + p.r) {
                        if (p.targetUnit === player) {
                            if (player.shield > 0) player.shield -= p.dmg;
                            else player.hp -= p.dmg;
                            addFloatText(player.x, player.y, `-${Math.round(p.dmg)}`, '#ff4757');
                            if (player.hp <= 0) endGame(false);
                        } else {
                            damageTarget(p.targetUnit, p.dmg, false);
                        }
                        p.dist = 9999;
                    }
                }
            });
            projectiles = projectiles.filter(p => p.dist < p.range);

            blueMinions = blueMinions.filter(m => m.hp > 0);
            redMinions = redMinions.filter(m => m.hp > 0);
            particles.forEach(pt => { pt.x += pt.vx; pt.y += pt.vy; pt.life--; });
            particles = particles.filter(pt => pt.life > 0);
            floatTexts.forEach(ft => { ft.y -= 0.5; ft.life--; });
            floatTexts = floatTexts.filter(ft => ft.life > 0);
        }

        function drawMap() {
            ctx.fillStyle = '#18331b';
            ctx.fillRect(-camX, -camY, MAP_W, MAP_H);

            ctx.strokeStyle = '#2d5a32';
            ctx.lineWidth = 90; ctx.lineCap = 'round'; ctx.lineJoin = 'round';

            ctx.beginPath(); ctx.moveTo(250 - camX, 1750 - camY); ctx.lineTo(250 - camX, 250 - camY); ctx.lineTo(1750 - camX, 250 - camY); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(250 - camX, 1750 - camY); ctx.lineTo(1750 - camX, 250 - camY); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(250 - camX, 1750 - camY); ctx.lineTo(1750 - camX, 1750 - camY); ctx.lineTo(1750 - camX, 250 - camY); ctx.stroke();

            ctx.strokeStyle = '#1d4ed8'; ctx.lineWidth = 110;
            ctx.beginPath(); ctx.moveTo(0 - camX, 2000 - camY); ctx.lineTo(2000 - camX, 0 - camY); ctx.stroke();

            ctx.fillStyle = 'rgba(0, 210, 255, 0.25)'; ctx.fillRect(50 - camX, 1550 - camY, 400, 400);
            ctx.fillStyle = 'rgba(255, 71, 87, 0.25)'; ctx.fillRect(1550 - camX, 50 - camY, 400, 400);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawMap();

            // Vẽ Quái rừng
            jungleMonsters.forEach(m => {
                if (m.state !== 'dead') {
                    ctx.beginPath();
                    ctx.arc(m.x - camX, m.y - camY, m.r, 0, Math.PI * 2);
                    ctx.fillStyle = m.color; ctx.fill();
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();

                    ctx.fillStyle = '#000'; ctx.fillRect(m.x - camX - 20, m.y - camY - m.r - 10, 40, 5);
                    ctx.fillStyle = '#2ed573'; ctx.fillRect(m.x - camX - 20, m.y - camY - m.r - 10, (m.hp / m.maxHp) * 40, 5);
                }
            });

            // Vẽ Trụ Đỏ & Tầm Trụ & Giáp Vàng MLBB
            redTurrets.forEach(s => {
                if (s.hp > 0) {
                    // Vẽ Tầm đánh Trụ
                    ctx.beginPath();
                    ctx.arc(s.x - camX, s.y - camY, s.range, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255, 71, 87, 0.15)'; ctx.lineWidth = 2; ctx.stroke();

                    // Thân Trụ
                    ctx.beginPath();
                    ctx.arc(s.x - camX, s.y - camY, s.r, 0, Math.PI * 2);
                    ctx.fillStyle = s.isNexus ? '#ff2056' : '#e15f41'; ctx.fill();
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke();

                    // Thanh Máu Trụ
                    ctx.fillStyle = '#000'; ctx.fillRect(s.x - camX - 24, s.y - camY - s.r - 14, 48, 6);
                    ctx.fillStyle = '#ff4757'; ctx.fillRect(s.x - camX - 24, s.y - camY - s.r - 14, (s.hp / s.maxHp) * 48, 6);

                    // Thanh Giáp Vàng (Gold Shield 5 phút đầu)
                    if (gameTime < 300 && s.goldShield > 0) {
                        ctx.fillStyle = '#ffd700';
                        ctx.fillRect(s.x - camX - 24, s.y - camY - s.r - 20, (s.goldShield / s.maxGoldShield) * 48, 4);
                    }
                }
            });

            // Vẽ Lính
            [...blueMinions, ...redMinions].forEach(m => {
                ctx.beginPath();
                ctx.arc(m.x - camX, m.y - camY, m.r, 0, Math.PI * 2);
                ctx.fillStyle = m.color; ctx.fill();
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();

                // Thanh máu lính
                ctx.fillStyle = '#000'; ctx.fillRect(m.x - camX - 12, m.y - camY - m.r - 7, 24, 3);
                ctx.fillStyle = m.isBlue ? '#38ef7d' : '#ff4757'; ctx.fillRect(m.x - camX - 12, m.y - camY - m.r - 7, (m.hp / m.maxHp) * 24, 3);
            });

            // Vẽ Lord
            if (alliedLord && alliedLord.hp > 0) {
                ctx.beginPath();
                ctx.arc(alliedLord.x - camX, alliedLord.y - camY, alliedLord.r, 0, Math.PI * 2);
                ctx.fillStyle = alliedLord.color; ctx.fill();
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
            }

            // Vẽ Đạn
            projectiles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x - camX, p.y - camY, p.r, 0, Math.PI * 2);
                ctx.fillStyle = p.color; ctx.fill();
            });

            // Vẽ Người chơi
            if (player.hp > 0) {
                if (player.redBuffTimer > 0) {
                    ctx.beginPath(); ctx.arc(player.x - camX, player.y - camY, player.radius + 6, 0, Math.PI * 2);
                    ctx.strokeStyle = '#ff4757'; ctx.lineWidth = 3; ctx.stroke();
                }
                if (player.blueBuffTimer > 0) {
                    ctx.beginPath(); ctx.arc(player.x - camX, player.y - camY, player.radius + 10, 0, Math.PI * 2);
                    ctx.strokeStyle = '#00d2ff'; ctx.lineWidth = 3; ctx.stroke();
                }

                ctx.beginPath();
                ctx.arc(player.x - camX, player.y - camY, player.radius, 0, Math.PI * 2);
                ctx.fillStyle = player.color; ctx.fill();
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();

                ctx.fillStyle = '#000'; ctx.fillRect(player.x - camX - 22, player.y - camY - 26, 44, 6);
                ctx.fillStyle = '#2ed573'; ctx.fillRect(player.x - camX - 22, player.y - camY - 26, (player.hp / player.maxHp) * 44, 6);
                if (player.shield > 0) {
                    ctx.fillStyle = '#eccc68'; ctx.fillRect(player.x - camX - 22, player.y - camY - 26, Math.min(44, (player.shield / 250) * 44), 6);
                }
            }

            // Hạt hiệu ứng & chữ sát thương
            particles.forEach(pt => {
                ctx.beginPath(); ctx.arc(pt.x - camX, pt.y - camY, pt.r, 0, Math.PI * 2);
                ctx.fillStyle = pt.color; ctx.fill();
            });

            floatTexts.forEach(ft => {
                ctx.fillStyle = ft.color; ctx.font = 'bold 12px sans-serif';
                ctx.fillText(ft.text, ft.x - camX - 10, ft.y - camY);
            });

            drawMinimap();
        }

        function drawMinimap() {
            miniCtx.clearRect(0, 0, 150, 150);
            let scale = 150 / MAP_W;

            miniCtx.fillStyle = '#0f2313'; miniCtx.fillRect(0, 0, 150, 150);
            miniCtx.strokeStyle = '#2d5a32'; miniCtx.lineWidth = 4;
            miniCtx.beginPath(); miniCtx.moveTo(20, 130); miniCtx.lineTo(20, 20); miniCtx.lineTo(130, 20); miniCtx.stroke();
            miniCtx.beginPath(); miniCtx.moveTo(20, 130); miniCtx.lineTo(130, 20); miniCtx.stroke();
            miniCtx.beginPath(); miniCtx.moveTo(20, 130); miniCtx.lineTo(130, 130); miniCtx.lineTo(130, 20); miniCtx.stroke();

            redTurrets.forEach(s => {
                if (s.hp > 0) {
                    miniCtx.fillStyle = '#ff4757';
                    miniCtx.fillRect(s.x * scale - 2, s.y * scale - 2, 5, 5);
                }
            });

            jungleMonsters.forEach(m => {
                if (m.state !== 'dead') {
                    miniCtx.fillStyle = m.color;
                    miniCtx.beginPath(); miniCtx.arc(m.x * scale, m.y * scale, 3, 0, Math.PI * 2); miniCtx.fill();
                }
            });

            blueMinions.forEach(m => {
                miniCtx.fillStyle = '#00ffff'; miniCtx.fillRect(m.x * scale - 1, m.y * scale - 1, 2, 2);
            });
            redMinions.forEach(m => {
                miniCtx.fillStyle = '#ff4757'; miniCtx.fillRect(m.x * scale - 1, m.y * scale - 1, 2, 2);
            });

            miniCtx.fillStyle = '#00d2ff';
            miniCtx.beginPath(); miniCtx.arc(player.x * scale, player.y * scale, 4, 0, Math.PI * 2); miniCtx.fill();

            miniCtx.strokeStyle = '#ffffff'; miniCtx.lineWidth = 1;
            miniCtx.strokeRect(camX * scale, camY * scale, canvas.width * scale, canvas.height * scale);
        }

        function endGame(victory) {
            isGameOver = true;
            const modal = document.getElementById('endModal');
            modal.style.display = 'flex';
            if (victory) {
                modal.className = 'modal victory';
                document.getElementById('modalTitle').innerText = 'VICTORY!';
            } else {
                modal.className = 'modal defeat';
                document.getElementById('modalTitle').innerText = 'DEFEAT!';
            }
        }

        function restartGame() {
            document.getElementById('endModal').style.display = 'none';
            isGameOver = false; killCount = 0; gameTime = 0;
            player.x = 250; player.y = 1750; player.hp = player.maxHp; player.gold = 300;
            redTurrets.forEach(s => { s.hp = s.maxHp; s.goldShield = s.maxGoldShield; s.target = null; });
            jungleMonsters.forEach(m => { m.hp = m.maxHp; m.state = 'idle'; });
            blueMinions = []; redMinions = []; alliedLord = null;
            spawnWave(); updateUI();
        }

        function loop() { update(); draw(); requestAnimationFrame(loop); }
        loop();
    </script>
</body>
